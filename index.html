<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>能高小幫手</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="header-title">今日訂單</div>
        <div id="user-info" style="font-size: 13px; font-weight: normal; margin-top: 4px;">
            客戶：<span id="display-name">載入中...</span>
        </div>
    </header>

    <div class="main-container">
        <div id="order-page" class="page-content active-page">
            <aside id="sidebar">
                <div class="category-item active" onclick="changeCategory('全部品項', this)">全部品項</div>
                <div class="category-item" onclick="changeCategory('根莖類', this)">根莖類</div>
                <div class="category-item" onclick="changeCategory('蔬菜類', this)">蔬菜類</div>
                <div class="category-item" onclick="changeCategory('水果類', this)">水果類</div>
            </aside>
            <main id="product-list-container">
                <div id="cat-label" style="padding:10px; font-weight:bold; background:#f9f9f9;">全部品項</div>
                <div id="product-list"></div>
            </main>
            <button id="main-submit-btn" onclick="addToCart()">加入<br>訂單</button>
        </div>

        <div id="cart-page" class="page-content">
            <div id="temp-order-list"></div>
        </div>

        <div id="history-page" class="page-content">
            <div id="final-history-list"></div>
            <div style="text-align:center; font-size:12px; color:#999; padding:20px;">
                僅顯示最近 20 筆訂單紀錄
            </div>
        </div>

        <div id="report-page" class="page-content">
            <div class="report-card">
                <h3 style="color:#cc0000">瑕疵回報</h3>
                <label>銷貨單號 *</label>
                <input type="text" id="rep-id" placeholder="請輸入單號">
                <label>回報內容 *</label>
                <textarea id="rep-items" rows="5" placeholder="請填寫品項與原因..."></textarea>
                <button class="btn-green-submit" onclick="submitReport()">送出回報</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="nav-icons">
            <div class="nav-icon" onclick="showPage('order')">今日訂單</div>
            <div class="nav-icon" onclick="showPage('cart')">待送出</div>
            <div class="nav-icon" onclick="showPage('history')">訂單紀錄</div>
            <div class="nav-icon" onclick="showPage('report')">問題回報</div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
